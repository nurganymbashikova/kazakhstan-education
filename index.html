<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <title>카자흐스탄의 학교 교육 시스템</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.css">
    <style>
        body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eee9df;
    color: #252525;
}

        .slide {
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    text-align: left;
    padding: 80px;
    box-sizing: border-box;
}

        h1 {
    font-size: 72px;
    max-width: 900px;
    margin: 0 0 25px 0;
    line-height: 1.05;
}

        p {
    font-size: 28px;
    margin: 0;
}
.slide-label {
    font-size: 14px;
    letter-spacing: 3px;
    font-weight: bold;
    margin-bottom: 20px;
    opacity: 0.55;
}

.intro {
    font-size: 20px;
    margin-top: 0;
    opacity: 0.65;
}

.cards {
    display: flex;
    gap: 24px;
    width: 100%;
    margin-top: 35px;
}

.card {
    flex: 1;
    min-height: 260px;
    padding: 30px;
    border-radius: 24px;
    box-sizing: border-box;
    text-align: left;

    background: white;

    border: 1px solid rgba(0, 0, 0, 0.08);

    box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.08);

    transition: transform 0.3s ease;
}

.card:hover {
    transform: translateY(-8px);
}

.card-number {
    font-size: 14px;
    letter-spacing: 2px;
    opacity: 0.5;
}

.card h2 {
    font-size: 32px;
    margin: 45px 0 10px 0;
}

.card p {
    font-size: 19px;
    margin: 0;
    opacity: 0.6;
}

.years {
    font-size: 42px;
    font-weight: bold;
    margin-top: 30px;
}

.terms {
    margin-top: 30px;
    padding: 16px 22px;

    border-radius: 14px;

    background: rgba(255, 255, 255, 0.7);

    font-size: 16px;
}

.terms span {
    opacity: 0.55;
    margin-right: 15px;
}

.terms strong {
    font-weight: 600;
}
    </style>
</head>

<body>

<div class="reveal">
    <div class="slides">

    <section class="slide">

        <h1>카자흐스탄의 학교 교육 시스템</h1>

        <p>초등학교부터 고등학교까지</p>

    </section>
    
<section class="slide">

    <div class="slide-label">01 / EDUCATION STRUCTURE</div>

    <h1>학교 교육의 구조</h1>

    <p class="intro">
        카자흐스탄의 학교 교육은 학년과 교육 단계에 따라 구성됩니다.
    </p>

    <div class="cards">

        <div class="card primary">
            <div class="card-number">01</div>
            <h2>초등학교</h2>
            <p>1–4학년</p>
            <div class="years">4년</div>
        </div>

        <div class="card middle">
            <div class="card-number">02</div>
            <h2>중학교</h2>
            <p>5–9학년</p>
            <div class="years">5년</div>
        </div>

        <div class="card high">
            <div class="card-number">03</div>
            <h2>고등학교</h2>
            <p>10–11(12)학년</p>
            <div class="years">2(3)년</div>
        </div>

    </div>

    <div class="terms">
        <span>학년 운영</span>
        <strong>연간 4개 학기(Quarter/Term)</strong>
    </div>

</section>
            </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.js"></script>

<script>
    Reveal.initialize();
</script>
    
</body>

</html>
