<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <title>카자흐스탄의 학교 교육 시스템</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.css">
    <style>
        body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eee9df;
    color: #252525;
}

        .slide {
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    text-align: left;
    padding: 80px;
    box-sizing: border-box;
}

        h1 {
    font-size: 72px;
    max-width: 900px;
    margin: 0 0 25px 0;
    line-height: 1.05;
}

        p {
    font-size: 28px;
    margin: 0;
}
    </style>
</head>

<body>

<div class="reveal">
    <div class="slides">

    <section class="slide">

        <h1>카자흐스탄의 학교 교육 시스템</h1>

        <p>초등학교부터 고등학교까지</p>

    </section>
    
    <section class="slide">

    <h1>학교 교육의 구조</h1>

    <div class="cards">

        <div class="card">
            <h2>초등학교</h2>
            <p>1–4학년</p>
            <strong>4년</strong>
        </div>

        <div class="card">
            <h2>중학교</h2>
            <p>5–9학년</p>
            <strong>5년</strong>
        </div>

        <div class="card">
            <h2>고등학교</h2>
            <p>10–11학년</p>
            <strong>2년</strong>
        </div>

    </div>

</section>
            </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.js"></script>

<script>
    Reveal.initialize();
</script>
    
</body>

</html>
