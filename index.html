<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <title>카자흐스탄의 학교 교육 시스템</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.css">
    <style>
        body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eee9df;
    color: #252525;
}

        .slide {
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    text-align: left;
    padding: 80px;
    box-sizing: border-box;
}

        h1 {
    font-size: 72px;
    max-width: 900px;
    margin: 0 0 25px 0;
    line-height: 1.05;
}

        p {
    font-size: 28px;
    margin: 0;
}
        .cards {
    display: flex;
    gap: 30px;
    margin-top: 40px;
}

.card {
    width: 250px;
    padding: 35px;
    background: white;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
}

.card h2 {
    font-size: 30px;
    margin-top: 0;
}

.card p {
    font-size: 20px;
}

.card strong {
    font-size: 40px;
}
    </style>
</head>

<body>

<div class="reveal">
    <div class="slides">

    <section class="slide">

        <h1>카자흐스탄의 학교 교육 시스템</h1>

        <p>초등학교부터 고등학교까지</p>

    </section>
    
<section class="slide">

    <div class="slide-label">01 / EDUCATION STRUCTURE</div>

    <h1>학교 교육의 구조</h1>

    <p class="intro">
        카자흐스탄의 학교 교육은 학년과 교육 단계에 따라 구성됩니다.
    </p>

    <div class="cards">

        <div class="card primary">
            <div class="card-number">01</div>
            <h2>초등학교</h2>
            <p>1–4학년</p>
            <div class="years">4년</div>
        </div>

        <div class="card middle">
            <div class="card-number">02</div>
            <h2>중학교</h2>
            <p>5–9학년</p>
            <div class="years">5년</div>
        </div>

        <div class="card high">
            <div class="card-number">03</div>
            <h2>고등학교</h2>
            <p>10–11(12)학년</p>
            <div class="years">2(3)년</div>
        </div>

    </div>

    <div class="terms">
        <span>학년 운영</span>
        <strong>연간 4개 학기(Quarter/Term)</strong>
    </div>

</section>
            </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.js"></script>

<script>
    Reveal.initialize();
</script>
    
</body>

</html>
